name: Unzip repo files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Unzip uploaded archive
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP"
          unzip -o "$ZIP"
          for d in */; do
            d=${d%/}
            if [ -f "$d/README.md" ] && [ -d "$d/src" ]; then
              echo "Repo files are in folder $d - moving into place"
              cp -a "$d"/. ./
              rm -rf "$d"
            fi
          done
          rm -f "$ZIP"
          if [ -f .github/workflows/ci.yml ]; then
            echo "=== CI workflow content (added via web UI later) ==="
            cat .github/workflows/ci.yml
            echo "=== end CI workflow content ==="
          fi
          ls -la
      - name: Commit unpacked files
        run: |
          git config user.name "haiderstudio"
          git config user.email "haiderstudio@users.noreply.github.com"
          git add -A
          if [ -f .github/workflows/ci.yml ]; then
            git restore --staged .github/workflows/ci.yml
            rm -f .github/workflows/ci.yml
          fi
          git status
          git commit -m "Unpack repo files" || echo "Nothing to commit"
          git push
